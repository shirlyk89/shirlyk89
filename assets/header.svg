<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa">
        <animate attributeName="stop-color" values="#a78bfa;#22d3ee;#f472b6;#a78bfa" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#f472b6;#a78bfa;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#f472b6">
        <animate attributeName="stop-color" values="#f472b6;#a78bfa;#22d3ee;#f472b6" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <style>
    .title { font: 800 56px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -1px; }
    .sub   { font: 500 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #cbd5e1; letter-spacing: 4px; }
    .tag   { font: 600 13px 'Segoe UI', Ubuntu, Arial, sans-serif; fill: #e2e8f0; }
    .code  { font: 600 22px 'Fira Code', Consolas, 'Courier New', monospace; fill: #94a3b8; }
    .fade1 { opacity: 0; animation: up .9s ease-out .2s forwards; }
    .fade2 { opacity: 0; animation: up .9s ease-out .7s forwards; }
    .fade3 { opacity: 0; animation: up .9s ease-out 1.2s forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    .float1 { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 7s ease-in-out 1s infinite; }
    .float3 { animation: float 5s ease-in-out 2s infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
    .line { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.6s ease-out 1s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>

    <!-- Orbes de luz animados -->
    <g filter="url(#blur)" opacity="0.55">
      <circle cx="200" cy="80" r="140" fill="#7c3aed">
        <animate attributeName="cx" values="200;320;200" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="80;160;80" dur="10s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1000" cy="260" r="150" fill="#0891b2">
        <animate attributeName="cx" values="1000;860;1000" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="260;180;260" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="320" r="110" fill="#db2777">
        <animate attributeName="cx" values="620;720;620" dur="13s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Símbolos de código flotando -->
    <text class="code float1" x="90" y="270" opacity="0.5">&lt;/&gt;</text>
    <text class="code float2" x="1060" y="90" opacity="0.5">{ }</text>
    <text class="code float3" x="1040" y="300" opacity="0.35">=&gt;</text>
    <text class="code float2" x="130" y="90" opacity="0.35">( )</text>

    <!-- Texto principal -->
    <g text-anchor="middle">
      <text class="sub fade1" x="600" y="105">DESARROLLADORA DE SOFTWARE</text>
      <text class="title fade2" x="600" y="178" fill="url(#name)">Shirly Katherinn Leal Nieves</text>
      <line class="line" x1="340" y1="205" x2="860" y2="205" stroke="url(#name)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Chips de tecnologías -->
    <g class="fade3">
      <g transform="translate(318 240)">
        <rect width="90" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#f89820" stroke-opacity="0.6"/>
        <text class="tag" x="45" y="22" text-anchor="middle">Java</text>
      </g>
      <g transform="translate(418 240)">
        <rect width="120" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#6db33f" stroke-opacity="0.6"/>
        <text class="tag" x="60" y="22" text-anchor="middle">Spring Boot</text>
      </g>
      <g transform="translate(548 240)">
        <rect width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#f7df1e" stroke-opacity="0.6"/>
        <text class="tag" x="55" y="22" text-anchor="middle">JavaScript</text>
      </g>
      <g transform="translate(668 240)">
        <rect width="90" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#3776ab" stroke-opacity="0.9"/>
        <text class="tag" x="45" y="22" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(768 240)">
        <rect width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ea4b71" stroke-opacity="0.7"/>
        <text class="tag" x="55" y="22" text-anchor="middle">n8n</text>
      </g>
    </g>
  </g>
</svg>
